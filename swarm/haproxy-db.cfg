global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    timeout queue 1m
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s

resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      3s
    hold refused    3s
    hold nx         3s
    hold timeout    3s
    hold valid      3s
    hold obsolete   3s

# PUERTO 5000: ESCRITURA Y TRANSACCIONES
frontend postgres_write_front
    bind *:5000
    mode tcp
    default_backend postgres_write_back

backend postgres_write_back
    mode tcp
    option pgsql-check user postgres
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db_primary db_primary:5432 maxconn 100 check resolvers docker_resolver init-addr libc,none
    server db_replica db_replica:5432 maxconn 100 check resolvers docker_resolver init-addr libc,none backup

# PUERTO 5001: LECTURA DISTRIBUIDA
frontend postgres_read_front
    bind *:5001
    mode tcp
    default_backend postgres_read_back

backend postgres_read_back
    mode tcp
    balance roundrobin
    option pgsql-check user postgres
    default-server inter 3s fall 3 rise 2
    server db_replica db_replica:5432 maxconn 100 check resolvers docker_resolver init-addr libc,none
    server db_primary db_primary:5432 maxconn 100 check resolvers docker_resolver init-addr libc,none backup

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

