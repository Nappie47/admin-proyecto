global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout check   5000ms

# Resolver DNS interno de Docker Swarm
resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      3s
    hold refused    3s
    hold nx         3s
    hold timeout    3s
    hold valid      3s
    hold obsolete   3s

frontend http_front
    bind *:80

    stats enable
    stats uri /haproxy?stats
    stats refresh 5s

    default_backend app_servers

backend app_servers
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3

    # En Docker Swarm, 'app_frontend' resuelve dinámicamente al Virtual IP (VIP)
    # que balancea en el kernel de Linux entre todas las réplicas activas del Frontend.
    server frontend_cluster app_frontend:80 check resolvers docker_resolver init-addr libc,none

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

