global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout check   5000ms

# Resolver DNS interno de la red Docker (permite resolución dinámica de contenedores)
resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

# ==============================================================================
# PUERTO 80: INGRESS PÚBLICO HTTP Y BALANCEO L7
# ==============================================================================
frontend http_front
    bind *:80

    # Panel de Estadísticas Web integrado
    stats enable
    stats uri /haproxy?stats
    stats refresh 5s

    default_backend app_servers

# ==============================================================================
# BACKEND: BALANCEO HACIA APP 1 (VM 2) Y APP 2 (VM 3)
# ==============================================================================
backend app_servers
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3

    # Servidores de Aplicación (Nginx + React SPA + Flask Gunicorn)
    server app_principal vm2_frontend_app1:80 check resolvers docker_resolver init-addr libc,none
    server app_replica   vm3_frontend_app2:80 check resolvers docker_resolver init-addr libc,none

# ==============================================================================
# PUERTO 8404: PANEL DE MONITOREO Y ESTADÍSTICAS AVANZADAS
# ==============================================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

