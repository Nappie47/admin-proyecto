global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Resolver interno para resolución dinámica de nombres en Docker / GCP
resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend http_front
    bind *:80
    stats enable
    stats uri /haproxy?stats
    stats refresh 5s
    default_backend app_servers

backend app_servers
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    # En desarrollo local resuelve los nombres de contenedor Docker.
    # En GCP se configuran las IPs internas de VM 2 y VM 3 (ej. 10.0.2.11 y 10.0.2.12).
    server app_principal vm2_frontend_app1:80 check resolvers docker_resolver init-addr libc,none inter 3000ms rise 2 fall 3
    server app_replica vm3_frontend_app2:80 check resolvers docker_resolver init-addr libc,none inter 3000ms rise 2 fall 3
