version: '3.8'

# ==========================================================
# VM 6: SERVIDOR DE BASE DE DATOS 2 (RÉPLICA / SOLO LECTURA)
# Capa 4 de la Arquitectura 2: PostgreSQL 16 + PostGIS
# En GCP: Instancia e2-small en Subred DB (IP 10.0.3.12)
# ==========================================================

services:
  db-replica:
    image: postgis/postgis:16-3.4-alpine
    container_name: vm6_db_replica
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"   # Puerto expuesto alternativo en PC para evitar colisión con Primario
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cementerio_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - red_cementerio

volumes:
  pgdata_replica:
    name: pgdata_replica_volume

networks:
  red_cementerio:
    external: true
    name: red_cementerio_cluster
