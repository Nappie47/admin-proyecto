# ==============================================================================
# PROYECTO INTEGRADOR - UNIDAD 2: ARQUITECTURA CLOUD EN GOOGLE CLOUD PLATFORM
# Plataforma Web y SIG - Cementerio General Comuna de Los Ángeles
# Integrantes: Bryan Ahumada - Johan Muñoz
# ==============================================================================
# Servicios: 3 Contenedores por Máquina Virtual (Frontend Nginx, AI FastAPI, Backend Flask)
# Balanceo Externo: Google Cloud External Application Load Balancer
# Base de Datos: Google Cloud SQL Regional (PostgreSQL 16 + PostGIS)
# ==============================================================================

name: sig-cementerio-cloud

networks:
  cloud_net:
    driver: bridge
    name: sig_cloud_network

volumes:
  ai_cloud_data:
    name: sig_ai_cloud_data

services:
  # ============================================================================
  # 1. FRONTEND WEB & REVERSE PROXY (Nginx en puerto 80 hacia internet)
  # Sirve React y redirige internamente /api/ al backend y /api/ai/ al servicio facial
  # ============================================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: sig_frontend
    restart: always
    ports:
      - "80:8080"
    networks:
      - cloud_net
    depends_on:
      backend:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. MICROSERVICIO DE IA Y BIOMETRÍA FACIAL (FastAPI + OpenCV)
  # ============================================================================
  ai_service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: sig_ai_service
    restart: always
    environment:
      - PORT=5001
      - AI_DATA_DIR=/app/data/faces
    volumes:
      - ai_cloud_data:/app/data/faces
    networks:
      - cloud_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 3. SERVIDOR API BACKEND (Flask + PostGIS conectado a Google Cloud SQL)
  # ============================================================================
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: sig_backend
    restart: always
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-cementerio-los-angeles-secret-key-2026-prod}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cementerio-jwt-super-secret-key-2026-prod}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cementerio_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - AI_SERVICE_URL=http://ai_service:5001
      - RUN_SEED=${RUN_SEED:-false}
    networks:
      - cloud_net
    depends_on:
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
