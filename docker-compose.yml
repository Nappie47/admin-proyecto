# ==============================================================================
# PROYECTO INTEGRADOR - UNIDAD 2: ARQUITECTURA DE ALTA DISPONIBILIDAD EN GOOGLE CLOUD
# Plataforma Web y SIG - Cementerio General Comuna de Los Ángeles
# Licitación Mercado Público: 2411-8-LE25
# Integrantes: Bryan Ahumada - Johan Muñoz
# ==============================================================================
# Nota: La persistencia relacional reside en Google Cloud SQL Regional (PostgreSQL 16)
# y la entrada pública es gestionada por Google Cloud Application Load Balancer.
# ==============================================================================

name: sig-cementerio-cloud

networks:
  cloud_net:
    driver: bridge
    name: sig_cloud_network

volumes:
  ai_cloud_data:
    name: sig_ai_cloud_data

services:
  # ============================================================================
  # CAPA 1: INGRESS / API GATEWAY (HAProxy L7 en Puerto 80)
  # Recibe el tráfico desde Google Cloud Load Balancer y enruta a microservicios
  # ============================================================================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: sig_gateway
    restart: always
    ports:
      - "80:80"
      - "8404:8404"
    networks:
      - cloud_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  # ============================================================================
  # CAPA 2: FRONTEND WEB (React SPA servido por Nginx en puerto 8080 interno)
  # ============================================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: sig_frontend
    restart: always
    networks:
      - cloud_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # CAPA 2: MICROSERVICIO DE IA Y BIOMETRÍA FACIAL (FastAPI + OpenCV)
  # ============================================================================
  ai_service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: sig_ai_service
    restart: always
    environment:
      - PORT=5001
      - AI_DATA_DIR=/app/data/faces
    volumes:
      - ai_cloud_data:/app/data/faces
    networks:
      - cloud_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # CAPA 2: SERVIDOR API BACKEND (Flask + PostGIS conectado a Google Cloud SQL)
  # ============================================================================
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: sig_backend
    restart: always
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-cementerio-los-angeles-secret-key-2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cementerio-jwt-super-secret-key-2026}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-cementerio_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cementerio_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - AI_SERVICE_URL=http://ai_service:5001
      - RUN_SEED=${RUN_SEED:-false}
    networks:
      - cloud_net
    depends_on:
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
