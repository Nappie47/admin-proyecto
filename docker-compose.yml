# ==============================================================================
# PROYECTO INTEGRADOR - UNIDAD 2: ARQUITECTURA BASADA EN CONTENEDORES
# Plataforma Web y SIG - Cementerio General Comuna de Los Ángeles
# Licitación Mercado Público: 2411-8-LE25
# Integrantes: Bryan Ahumada - Johan Muñoz
# ==============================================================================

name: sig-cementerio-u2

networks:
  frontend_net:
    driver: bridge
    name: sig_frontend_network
  backend_net:
    driver: bridge
    name: sig_backend_network
  db_net:
    driver: bridge
    internal: true # Seguridad: Red interna aislada de internet
    name: sig_db_network
  monitoring_net:
    driver: bridge
    name: sig_monitoring_network

volumes:
  db_data:
    name: sig_db_postgres_data
  prometheus_data:
    name: sig_prometheus_data
  grafana_data:
    name: sig_grafana_data

services:
  # ============================================================================
  # CAPA 1: INGRESS / API GATEWAY (Punto de Entrada Único)
  # ============================================================================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: sig_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # CAPA 2: FRONTEND SPA (React 18 + Vite + Leaflet)
  # ============================================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: sig_frontend
    restart: unless-stopped
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # CAPA 3: BACKEND CORE API (Flask RESTful + PostGIS + Gunicorn)
  # ============================================================================
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: sig_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-cementerio-los-angeles-secret-key-2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cementerio-jwt-super-secret-key-2026}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_password_2026}@database:5432/${DB_NAME:-cementerio_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password_2026}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cementerio_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    networks:
      - backend_net
      - db_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ============================================================================
  # CAPA 4: BASE DE DATOS ESPACIAL (PostgreSQL 16 + PostGIS 3.4)
  # ============================================================================
  database:
    image: postgis/postgis:16-3.4-alpine
    container_name: sig_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cementerio_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password_2026}
      TZ: America/Santiago
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cementerio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # CAPA 5: MONITOREO Y MÉTRICAS (Prometheus)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sig_prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring_net
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # CAPA 5: DASHBOARDS Y OBSERVABILIDAD (Grafana)
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sig_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_grafana_2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring_net
    depends_on:
      prometheus:
        condition: service_healthy
