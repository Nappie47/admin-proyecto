scope: cementerio-cluster
namespace: /service
name: node-6

restapi:
  listen: 10.0.3.12:8008
  connect_address: 10.0.3.12:8008

etcd:
  hosts:
    - 10.0.3.10:2379
    - 10.0.3.11:2379
    - 10.0.3.12:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        listen_addresses: '*'
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby: 'on'

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 10.0.3.0/24 md5
    - host all all 10.0.0.0/16 md5
    - host all all 127.0.0.1/32 trust

postgresql:
  listen: 10.0.3.12:5432
  connect_address: 10.0.3.12:5432
  data_dir: /var/lib/postgresql/17/patroni
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /var/lib/postgresql/.pgpass
  authentication:
    replication:
      username: replicator
      password: ReplicaPassword123!
    superuser:
      username: postgres
      password: PostgresPassword123!

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
