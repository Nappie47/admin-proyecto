# ==============================================================================
# Prometheus Configuration - SIG Cementerio General Los Ángeles (Unidad 2 HA)
# ==============================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway_web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:8404"]

  - job_name: "backend_1"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend_1:5000"]

  - job_name: "backend_2"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend_2:5000"]

  - job_name: "ai_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai_service:5001"]

  - job_name: "haproxy_db"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["haproxy_db:7000"]
