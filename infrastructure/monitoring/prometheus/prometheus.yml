# ==============================================================================
# Prometheus Configuration - SIG Cementerio General Los Ángeles
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway"
    metrics_path: "/nginx_status"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "backend"
    metrics_path: "/api/health"
    static_configs:
      - targets: ["backend:5000"]
