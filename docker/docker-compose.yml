# docker-compose.yml - Solo para DESARROLLO LOCAL
# NOTA: En producción (Cloud Run) no se usa docker-compose,
# los servicios se despliegan individualmente via Terraform/Cloud Build

version: '3.8'

services:
  # ============================================================
  # API Service (FastAPI/Flask/Django)
  # ============================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: unidad3-api-dev
    environment:
      - ENVIRONMENT=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=unidad3_admin
      - DB_USER=app_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8080"
    volumes:
      - ../app:/app:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unidad3-internal
      - unidad3-public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # Frontend (React/Vue/Svelte + Nginx)
  # ============================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: unidad3-frontend-dev
    environment:
      - ENVIRONMENT=development
      - API_URL=http://localhost:8000/api
    ports:
      - "3000:8080"
    volumes:
      - ../frontend:/app:ro
    depends_on:
      - api
    networks:
      - unidad3-public
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # AI Service (Modelo ML ligero - ONNX/TensorFlow Lite)
  # ============================================================
  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    container_name: unidad3-ai-dev
    environment:
      - ENVIRONMENT=development
      - MODEL_PATH=/app/models
      - LOG_LEVEL=DEBUG
    ports:
      - "8001:8080"
    volumes:
      - ../ai:/app:ro
      - ./models:/app/models:ro
    networks:
      - unidad3-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: unidad3-db-dev
    environment:
      - POSTGRES_DB=unidad3_admin
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - unidad3-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d unidad3_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Redis (Cache/Sessions)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: unidad3-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unidad3-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # pgAdmin (Solo desarrollo)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: unidad3-pgadmin-dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@unidad3.local
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - unidad3-public
    profiles:
      - tools

  # ============================================================
  # Redis Commander (Solo desarrollo)
  # ============================================================
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: unidad3-redis-commander-dev
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=admin
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - unidad3-public
    profiles:
      - tools

networks:
  unidad3-internal:
    name: unidad3-internal-dev
    driver: bridge
    internal: true  # Sin acceso a internet directo
  unidad3-public:
    name: unidad3-public-dev
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local