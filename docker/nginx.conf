# ============================================================
# Nginx Hardened Configuration - Ingress Gateway
# Unidad 3: Hardening, Criptografía y Seguridad Perimetral
# Integrantes: Bryan Ahumada - Johan Muñoz
# ============================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================
    # 1. HARDENING DE INFORMACIÓN Y SERVIDOR
    # ========================================================
    server_tokens off;                     # Ocultar version de Nginx
    more_clear_headers Server;             # Si modulo headers-more esta disponible
    client_max_body_size 15M;              # Limitar tamano de uploads (fotos mausoleos)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts contra ataques de denegacion de servicio tipo Slowloris
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Optimizaciones de rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ========================================================
    # 2. LOGGING Y FORMATO DE AUDITORÍA
    # ========================================================
    log_format main_secure '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time ssl=$ssl_protocol cipher=$ssl_cipher';

    access_log /var/log/nginx/access.log main_secure;

    # ========================================================
    # 3. RATE LIMITING (Control perimetral contra fuerza bruta y DoS)
    # ========================================================
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # ========================================================
    # 4. CABECERAS GLOBALES DE SEGURIDAD HTTP (OWASP)
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.basemaps.cartocdn.com https://images.unsplash.com; connect-src 'self' ws: wss: https://maps.googleapis.com;" always;

    # Upstreams de los microservicios internos
    upstream frontend_upstream {
        server frontend:8080 max_fails=3 fail_timeout=10s;
    }

    upstream backend_upstream {
        server backend:5000 max_fails=3 fail_timeout=10s;
    }

    upstream ai_upstream {
        server ai-service:5001 max_fails=3 fail_timeout=10s;
    }

    # ========================================================
    # SERVIDOR HTTP (PUERTO 80) -> REDIRECCIÓN OBLIGATORIA A HTTPS
    # ========================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Endpoint ACME para renovacion de Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redireccion 301 permanente a HTTPS para todo el trafico restante
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================
    # SERVIDOR HTTPS (PUERTO 443) -> ENDURECIMIENTO TLS 1.2 / 1.3
    # ========================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # Certificados SSL/TLS (Let's Encrypt o certificado del host)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Protocolos seguros permitidos: SOLO TLSv1.2 y TLSv1.3 (SSLv2, SSLv3, TLS 1.0 y 1.1 desactivados)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Suites de cifrado seguras con Perfect Forward Secrecy (PFS)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # Optimizaciones y Session Cache TLS
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Gzip seguro
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Limitar conexiones simultaneas por IP
        limit_conn addr_conn 20;

        # ====================================================
        # Enrutamiento: Frontend SPA
        # ====================================================
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ====================================================
        # Enrutamiento: API REST Backend Core
        # ====================================================
        location /api/ {
            limit_req zone=general_limit burst=25 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ====================================================
        # Enrutamiento: Autenticacion (Rate Limit estricto contra fuerza bruta)
        # ====================================================
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ====================================================
        # Enrutamiento: Microservicio de IA Biometrica
        # ====================================================
        location /api/ai/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ====================================================
        # WebSockets (Actualizaciones en tiempo real del mapa)
        # ====================================================
        location /ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        # Healthcheck endpoint
        location /health {
            access_log off;
            return 200 "Ingress Gateway Healthy\n";
        }
    }
}
