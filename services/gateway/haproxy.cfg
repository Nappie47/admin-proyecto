global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout check   5000ms

# Resolver DNS interno de Docker
resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

# ==============================================================================
# PUERTO 80: INGRESS PÚBLICO HTTP Y BALANCEO L7
# ==============================================================================
frontend http_front
    bind *:80

    # Panel de Estadísticas Web Integrado
    stats enable
    stats uri /haproxy?stats
    stats refresh 5s

    # Microservicios: Detección y Enrutamiento por Ruta
    acl is_api path_beg /api/
    use_backend api_cluster if is_api
    default_backend web_cluster

# ==============================================================================
# CLÚSTER WEB (FRONTEND REACT SPA REPLICADO)
# ==============================================================================
backend web_cluster
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3
    server frontend_1 frontend_1:8080 check resolvers docker_resolver init-addr libc,none
    server frontend_2 frontend_2:8080 check resolvers docker_resolver init-addr libc,none

# ==============================================================================
# CLÚSTER API (BACKEND CORE FLASK REPLICADO)
# ==============================================================================
backend api_cluster
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3
    server backend_1 backend_1:5000 check resolvers docker_resolver init-addr libc,none
    server backend_2 backend_2:5000 check resolvers docker_resolver init-addr libc,none

# ==============================================================================
# PUERTO 8404: PANEL DE MONITOREO Y ESTADÍSTICAS AVANZADAS
# ==============================================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

