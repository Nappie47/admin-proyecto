global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout check   5000ms

# Resolver DNS interno de Docker
resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

# ==============================================================================
# PUERTO 80: INGRESS LOCAL DE LA VM (Recibe del Google Cloud Load Balancer)
# ==============================================================================
frontend http_front
    bind *:80

    # Panel de Estadísticas Web Integrado
    stats enable
    stats uri /haproxy?stats
    stats refresh 5s

    # Ruta de Health Check directo para el Google Cloud Load Balancer
    monitor-uri /cloud-health

    # Microservicios: Detección y Enrutamiento por Ruta
    acl is_ai path_beg /api/ai/
    acl is_api path_beg /api/
    use_backend ai_cluster if is_ai
    use_backend api_cluster if is_api
    default_backend web_cluster

# ==============================================================================
# CLÚSTER WEB (FRONTEND REACT SPA)
# ==============================================================================
backend web_cluster
    mode http
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3
    server frontend frontend:8080 check resolvers docker_resolver init-addr libc,none

# ==============================================================================
# CLÚSTER API (BACKEND CORE FLASK CONECTADO A CLOUD SQL)
# ==============================================================================
backend api_cluster
    mode http
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3
    server backend backend:5000 check resolvers docker_resolver init-addr libc,none

# ==============================================================================
# CLÚSTER IA (MICROSERVICIO BIOMÉTRICO FACIAL)
# ==============================================================================
backend ai_cluster
    mode http
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3000ms rise 2 fall 3
    server ai_service ai_service:5001 check resolvers docker_resolver init-addr libc,none

# ==============================================================================
# PUERTO 8404: PANEL DE MONITOREO Y MÉTRICAS PROMETHEUS / DOCKER HEALTHCHECK
# ==============================================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
