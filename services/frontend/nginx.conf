server {
    listen 8080;
    server_name localhost;

    # ==============================================================================
    # FRONTEND SPA (Archivos estáticos de React)
    # ==============================================================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ==============================================================================
    # MICROSERVICIO DE IA (Biometría Facial)
    # ==============================================================================
    location /api/ai/ {
        proxy_pass http://ai_service:5001/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================================
    # API BACKEND FLASK (Conectado a Cloud SQL)
    # ==============================================================================
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================================
    # HEALTHCHECKS PARA GOOGLE CLOUD LOAD BALANCER Y DOCKER
    # ==============================================================================
    location /cloud-health {
        access_log off;
        return 200 "healthy\n";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
